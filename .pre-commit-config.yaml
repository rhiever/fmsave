default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: guard-staged
        name: guard (staged files)
        entry: uv run --frozen python scripts/guard.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: guard-commit-message
        name: guard (commit message)
        entry: uv run --frozen python scripts/guard.py --commit-msg
        language: system
        stages: [commit-msg]
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format check
        entry: uv run --frozen ruff format --check --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]
