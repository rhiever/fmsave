name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  # The release workflow calls this after publishing, so the web app's fmsave pin moves to
  # the new version as soon as PyPI lists it.
  workflow_call:
    inputs:
      wait-for-version:
        description: "An fmsave version to wait for on PyPI and pin the web app to"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --group docs
      - name: Build docs
        run: uv run --group docs sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Pin the web app to fmsave on PyPI
        env:
          WAIT_FOR_VERSION: ${{ inputs.wait-for-version }}
        run: |
          if [ -n "${WAIT_FOR_VERSION}" ]; then
            python3 scripts/app_pins.py docs/_build/html/app/pins.json --wait-for "${WAIT_FOR_VERSION}"
          else
            python3 scripts/app_pins.py docs/_build/html/app/pins.json
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
