name: Bug report
description: Report something fmsave gets wrong, without posting a save file.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never post a save file or a link to one here. A save sent privately is the fastest route to a fix: email a link to the address on [the maintainer's GitHub profile](https://github.com/rhiever). Format findings, `fmsave validate SAVE --json` output, a few example values and screenshots cropped to the bug are welcome. Keep bulk player data such as squads or CSVs private. Before posting, remove personal details: your manager name if it is your real name, your OS username and file paths, mod or DLL names, and platform IDs. [CONTRIBUTING.md](https://github.com/rhiever/fmsave/blob/main/CONTRIBUTING.md#reporting-a-wrong-value) says what helps most.
  - type: checkboxes
    id: no-real-data
    attributes:
      label: No save files or personal details
      options:
        - label: I have not posted a save file or a link to one, and removed personal details
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What went wrong
      description: The command or code you ran, and what happened. Use fictional names such as "Northbridge FC" or "Alex Example" if you need an example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: For a wrong value, name the field (such as `contract_end`) and describe what the game shows in general terms.
    validations:
      required: true
  - type: input
    id: fmsave-version
    attributes:
      label: fmsave version
      description: The output of `fmsave --version`.
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: The output of `python --version`.
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: game-build
    attributes:
      label: Game build (FM26 or FM27)
      description: The Build line from `fmsave info SAVE`.
    validations:
      required: true
  - type: textarea
    id: validate-output
    attributes:
      label: fmsave validate output
      description: The output of `fmsave validate SAVE --json`.
      render: json
    validations:
      required: true
