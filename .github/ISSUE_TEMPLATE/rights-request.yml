name: Rights holder or content removal request
description: Ask for content in this repository to be removed.
body:
  - type: markdown
    attributes:
      value: |
        Use this form if you hold rights in content in this repository, or act for someone who does, and want that content removed. Requests are handled as soon as possible.

        This issue is public. Do not post personal contact details or confidential material here. If the request needs a private channel, say so and a maintainer will arrange one.
  - type: checkboxes
    id: no-real-data
    attributes:
      label: No save files or real data
      options:
        - label: I have not attached a save file or any real player data
          required: true
  - type: textarea
    id: content
    attributes:
      label: Content to remove
      description: Links to the files, lines, commits, issues or releases concerned.
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: Rights concerned
      description: The rights you hold or represent, and why the content affects them.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Anything else
