[project]
name = "fmsave"
version = "0.1.0.dev0"
description = "Read Football Manager 26 save files into Python records, DataFrames, CSV and JSON."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Randal S. Olson" }]
keywords = ["football-manager", "fm26", "save", "parser", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
dependencies = ["backports.zstd>=1.7; python_version < '3.14'"]

[project.optional-dependencies]
pandas = ["pandas>=2.2"]
polars = ["polars>=1.0"]

[project.urls]
Repository = "https://github.com/rhiever/fmsave"
Issues = "https://github.com/rhiever/fmsave/issues"

[project.scripts]
fmsave = "fmsave.cli:main"

[dependency-groups]
test = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.4",
    "hypothesis>=6.168",
    "syrupy>=6.1",
]
dev = [
    { include-group = "test" },
    "ruff>=0.16.7,<0.17",
    "pyright>=1.1.414",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "standard"
strict = ["src", "scripts"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
strict = true
addopts = ["-ra"]
timeout = "120"
markers = [
    "corpus: needs the local private corpus (never runs in CI)",
    "corpus_fast: corpus tier for open, info, players and clubs",
    "corpus_full: corpus tier for every reader",
]

[tool.coverage.run]
branch = true
source = ["fmsave"]

[tool.coverage.report]
fail_under = 90
show_missing = true
